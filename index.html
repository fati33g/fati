<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroFat - Ekip Takip</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">

    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-center text-emerald-400">🔥 ZeroFat - Ekip Takip</h1>

        <div id="authEkranı" class="bg-gray-800 p-6 rounded-xl shadow space-y-4">
            <h2 class="text-lg font-semibold text-center text-gray-300">Sisteme Giriş Yap</h2>

            <button onclick="googleIleGirisYap()" class="w-full flex items-center justify-center space-x-3 bg-white hover:bg-gray-100 text-gray-900 font-bold p-3 rounded-lg transition shadow-md cursor-pointer">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5.04c1.62 0 3.08.56 4.22 1.66l3.15-3.15C17.45 1.68 14.93 1 12 1 7.28 1 3.26 3.72 1.3 7.69l3.75 2.91C5.93 7.43 8.72 5.04 12 5.04z" />
                    <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.46c-.29 1.48-1.14 2.73-2.42 3.57l3.75 2.91c2.2-2.03 3.7-5.02 3.7-8.63z" />
                    <path fill="#FBBC05" d="M5.05 14.4C4.81 13.66 4.68 12.87 4.68 12s.13-1.66.37-2.4L1.3 6.69C.47 8.35 0 10.12 0 12s.47 3.65 1.3 5.31l3.75-2.91z" />
                    <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.75-2.91c-1.11.75-2.53 1.19-4.21 1.19-3.28 0-6.07-2.39-7.06-5.56l-3.75 2.91C3.26 20.28 7.28 23 12 23z" />
                </svg>
                <span>Google ile Giriş Yap</span>
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-700"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-xs uppercase">Veya Klasik Giriş</span>
                <div class="flex-grow border-t border-gray-700"></div>
            </div>

            <input type="email" id="authEmail" class="w-full p-3 bg-gray-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="E-posta adresin">
            <input type="password" id="authSifre" class="w-full p-3 bg-gray-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Şifren">

            <div class="flex space-x-2">
                <button onclick="girisYap()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 p-3 rounded-lg font-bold text-sm transition cursor-pointer">Giriş Yap</button>
                <button onclick="kayitOl()" class="flex-1 bg-gray-600 hover:bg-gray-700 p-3 rounded-lg font-bold text-sm transition cursor-pointer">Kayıt Ol</button>
            </div>
        </div>

        <div id="anaEkran" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl text-xs text-gray-400">
                <span id="kullaniciMail">...</span>
                <button onclick="cikisYap()" class="text-red-400 hover:underline cursor-pointer">Çıkış Yap</button>
            </div>

            <div class="bg-gray-800 p-4 rounded-xl shadow">
                <label class="block text-sm font-medium mb-2">Bugünkü Kilo (kg)</label>
                <input type="number" id="kiloInput" step="0.1" class="w-full p-3 bg-gray-700 rounded-lg text-white font-bold text-xl text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="111.2">
            </div>

            <div class="bg-gray-800 p-4 rounded-xl shadow space-y-4">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Bugünün Görevleri</h2>

                <div id="gorevListesi" class="space-y-3">
                    <label class="flex items-center space-x-3 p-3 bg-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" id="yuruyus" class="w-6 h-6 rounded text-emerald-500">
                        <span class="text-lg">🏃‍♂️ 45 Dk Aç Karnına Yürüyüş</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" id="dambil" class="w-6 h-6 rounded text-emerald-500">
                        <span class="text-lg">🏋️‍♂️ Dambıl Antrenmanı</span>
                    </label>
                </div>

                <div class="flex space-x-2 pt-2 border-t border-gray-700">
                    <input type="text" id="yeniGorevInput" class="flex-1 p-2 bg-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Yeni görev ekle...">
                    <button onclick="yeniGorevEkle()" class="bg-emerald-500 hover:bg-emerald-600 px-4 rounded-lg font-bold text-sm cursor-pointer">+</button>
                </div>
            </div>

            <button onclick="veriyiSupabaseKaydet()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition text-white font-bold p-4 rounded-xl text-lg shadow-lg cursor-pointer">
                Günü Buluta Kaydet
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gczhnuorlvowujvdhxgf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FlrcsVgMZGCmpiTXz2mZuA_O4TP_phx";

        // Global nesne çakışmasını önleyen güvenli client başlatma
        const sClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async function () {
            const { data: { session } } = await sClient.auth.getSession();
            oturumAyarla(session);
        }

        function oturumAyarla(session) {
            if (session) {
                document.getElementById('authEkranı').classList.add('hidden');
                document.getElementById('anaEkran').classList.remove('hidden');
                document.getElementById('kullaniciMail').innerText = `Giriş yapıldı: ${session.user.email}`;
            } else {
                document.getElementById('authEkranı').classList.remove('hidden');
                document.getElementById('anaEkran').classList.add('hidden');
            }
        }

        // GOOGLE ILE GIRIS FONKSIYONU
        async function googleIleGirisYap() {
            const { data, error } = await sClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href // Giriş yapınca yine tam olarak bulunduğun sayfaya dönecek
                }
            });
            if (error) alert("Google giriş hatası: " + error.message);
        }

        // Klasik Kayıt
        async function kayitOl() {
            const email = document.getElementById('authEmail').value;
            const sifre = document.getElementById('authSifre').value;
            if (!email || !sifre) { alert("Lütfen mail ve şifre gir cano!"); return; }

            const { data, error } = await sClient.auth.signUp({ email, password: sifre });
            if (error) alert("Kayıt hatası: " + error.message);
            else alert("Kayıt başarılı! Mail kutunu kontrol et veya direkt giriş yapmayı dene.");
        }

        // Klasik Giriş
        async function girisYap() {
            const email = document.getElementById('authEmail').value;
            const sifre = document.getElementById('authSifre').value;
            if (!email || !sifre) { alert("Lütfen mail ve şifre gir cano!"); return; }

            const { data, error } = await sClient.auth.signInWithPassword({ email, password: sifre });
            if (error) alert("Giriş hatası: " + error.message);
            else oturumAyarla(data.session);
        }

        // Çıkış Yapma
        async function cikisYap() {
            await sClient.auth.signOut();
            oturumAyarla(null);
        }

        // Dinamik Görev Ekleme
        function yeniGorevEkle() {
            const input = document.getElementById('yeniGorevInput');
            const gorevMetni = input.value.trim();
            if (gorevMetni === "") return;

            const liste = document.getElementById('gorevListesi');
            const yeniID = "id_" + Date.now();
            const yeniGorevHTML = `
                    <label class="flex items-center space-x-3 p-3 bg-gray-700 rounded-lg cursor-pointer">
                        <input type="checkbox" id="${yeniID}" class="w-6 h-6 rounded text-emerald-500 ek-gorev">
                        <span class="text-lg">✨ ${gorevMetni}</span>
                    </label>
                `;
            liste.insertAdjacentHTML('beforeend', yeniGorevHTML);
            input.value = "";
        }

        // Veriyi Supabase'e Gönderme
        async function veriyiSupabaseKaydet() {
            const kilo = document.getElementById('kiloInput').value;
            const yuruyusYapildi = document.getElementById('yuruyus').checked;
            const dambilYapildi = document.getElementById('dambil').checked;
            const tarih = new Date().toLocaleDateString('tr-TR');

            if (!kilo) {
                alert("Kilonu girmeyi unuttun cano!");
                return;
            }

            const { data: { user } } = await sClient.auth.getUser();

            // Ekstra eklenen dinamik görevlerin durumunu metin olarak birleştirelim
            let ekGorevRaporu = "";
            document.querySelectorAll('.ek-gorev').forEach(el => {
                const gorevAdi = el.nextElementSibling.innerText;
                const durum = el.checked ? "Yapıldı" : "Yapılmadı";
                ekGorevRaporu += `${gorevAdi}: ${durum} | `;
            });

            const { error } = await sClient
                .from('sprint_takip')
                .insert([
                    {
                        user_id: user.id,
                        kilo: parseFloat(kilo),
                        yuruyus: yuruyusYapildi ? "Yapıldı" : "Yapılmadı",
                        dambil: dambilYapildi ? "Yapıldı" : "Yapılmadı",
                        tarih: tarih
                    }
                ]);

            if (error) {
                alert("Veri kaydedilemedi: " + error.message);
            } else {
                alert("Mükemmel! Verilerin ZeroFat veritabanına tıkır tıkır yazıldı.");
            }
        }
    </script>
</body>
</html>
